[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finhealth"
version = "1.3.0"
description = "Corporate financial health and distress prediction infrastructure"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "msgspec>=0.18.6",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
spark = ["pyspark>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pandas-stubs>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".venv/pytest-cache"
addopts = "--basetemp=.venv/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "imblearn.*", "pyspark.*", "scipy.*", "shap", "joblib", "threadpoolctl"]
ignore_missing_imports = true
